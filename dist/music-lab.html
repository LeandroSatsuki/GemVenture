<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemventure · Prévia musical</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="music-lab.css"></head>
<body><header><a href="./">◆ GEMVENTURE</a><a href="./">VOLTAR AO JOGO ↗</a></header>
<main><section class="intro-copy"><p class="eyebrow">PRÉVIA MUSICAL</p><h1>ESCOLHA<br><em>SEU SOM.</em></h1><p class="intro"><span id="discCount">Discos originais.</span><br>Um pulso claro.</p></section>
<section class="deck"><div class="choices"><label>DISCO<select id="record"></select></label><label>BIOMA<select id="theme"><option value="0">GRUTAS</option><option value="1">FLORESTA</option><option value="2">FÓSSEIS</option><option value="3">MANTO</option><option value="8">MICÉLIOS</option><option value="10">TOCAS DE ÂMBAR</option><option value="12">HORTAS</option></select></label><label>CLIMA<select id="mode"><option value="0">EXPLORAÇÃO</option><option value="4">CHEFE</option></select></label></div>
<div class="song"><h2 id="songName">PRISMA PULSE</h2><span id="tempo">116 BPM</span></div>
<div class="pulse" id="pulse" aria-hidden="true">◆</div><div class="cue" role="status"><strong id="cue">PRONTO?</strong><b id="count">♫</b></div>
<div class="timeline" aria-label="Partes da música"><span>FLUXO</span><span>IMPULSO</span><span>FLUXO</span><span>RESPIRO</span><span>RETORNO</span></div>
<div class="actions"><button id="play">▶ OUVIR</button><button id="turn" class="secondary">PRÓXIMA VIRADA ↗</button><button id="reset" class="secondary">↺ INÍCIO</button></div>
<p id="hint">Aviso antes. Mudança suave.</p><p class="note">Prévia livre: sem inimigos, dano ou perda de combo.</p>
</section></main><footer>TRILHAS ORIGINAIS · O MESMO SOM DO JOGO</footer><script type="module" src="music-lab.js"></script></body></html>
