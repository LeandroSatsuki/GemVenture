<html lang="pt-BR"><meta charset="utf-8"><title>QA — Forja e Árvore integradas</title><link rel="stylesheet" href="approved-services-shell.css"><style>body{background:#081a30;color:#edf4ff;font:18px sans-serif}button{padding:12px;margin:8px}dialog{padding:0}#qa-status{display:block}</style>
<button id="qa-forge">Abrir Forja real</button><button id="qa-tree">Abrir Árvore real</button><button id="qa-reset">Reiniciar amostra</button><label><input type="checkbox" id="qa-soft">Efeitos suaves</label><output id="qa-status"></output><dialog id="dialog" class="approved-ui-dialog"><div class="dialog-top"></div><div id="dialogBody"></div></dialog>
<script type="module">
import {createState,restoreState,learn,upgradeSkill} from '/core.js';import {buyCompactTalent} from '/compact-talents.js';import {SKILLS} from '/core.js';import {mountApprovedForge} from '/approved-forge-ui.js';import {mountApprovedTree} from '/approved-tree-ui.js';
const key='gemventure-approved-services-qa-only',q=s=>document.querySelector(s);let state,cleanup=null;
function initial(){const s=createState(712);s.level=5;s.bank=5840;s.best=15;s.materials=[240,120,95,180];s.experience.points=100;for(const id of ['ear','force','fortune','breath','dash','shatter','stun'])learn(s,id);upgradeSkill(s,'force');for(let i=0;i<3;i++)buyCompactTalent(s,'branch-1-critical',SKILLS);s.experience.points=12;return s;}
state=restoreState(localStorage.getItem(key))||initial();
function status(){q('#qa-status').textContent=JSON.stringify({bank:state.bank,materials:state.materials,level:state.level,core:state.core,building:state.village.forge,points:state.experience.points,funds:state.forge.funds});}function changed(){localStorage.setItem(key,JSON.stringify(state));status();}function close(){cleanup?.();cleanup=null;q('#dialog').close();}function open(kind){cleanup?.();q('#dialog').showModal();cleanup=(kind==='forge'?mountApprovedForge:mountApprovedTree)(q('#dialog'),state,{onChange:changed,onClose:close,softMode:()=>q('#qa-soft').checked});}
q('#qa-forge').onclick=()=>open('forge');q('#qa-tree').onclick=()=>open('tree');q('#qa-reset').onclick=()=>{state=initial();changed();};q('#dialog').addEventListener('close',()=>{cleanup?.();cleanup=null;});status();
</script></html>
