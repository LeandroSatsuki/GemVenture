<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemventure — teste visual de efeitos</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/expedition.css"><link rel="stylesheet" href="/readable.css"><link rel="stylesheet" href="/combat-feedback.css"><body><header><a class="brand" href="/">GEM<span>VENTURE</span></a><div class="top-actions"><button id="impact">Impacto</button><button id="wave">Onda de choque</button><button id="nova">Ruptura</button><button id="soft">Efeitos suaves</button><button id="animate">Animar</button></div></header><main><div class="scene-heading"><div><span class="eyebrow">TESTE VISUAL · CENA CONTROLADA</span><h1>O subsolo responde ao seu ritmo.</h1></div></div><section class="stage" id="stage" data-tier="3"><canvas id="world"></canvas><div class="stage-corner">GRUTAS DE CRISTAL<small>HEPT32 · EFEITOS EM TEMPO REAL</small></div><div class="run-hud"><div class="combo"><small>SEQUÊNCIA</small><strong>24<span>×</span></strong><span>SUPERNOVA</span></div></div><div class="combo-burst" style="opacity:1" data-tier="4"><small id="caption">RUPTURA TOTAL</small><strong>24<span>×</span></strong><span>COMBO!</span></div><div class="stage-message">Quadro congelado para inspecionar partículas e avisos de ataque.</div></section><footer>Prévia de teste do mesmo renderizador e das regras do jogo. <span id="stats"></span></footer></main><script type="module">
import {World} from '/world.js';import {createState,startRun,act,generateRoom} from '/core.js';import {reveal,isFloor} from '/cavern.js';
const $=id=>document.getElementById(id),w=new World($('world'));let s,running=false,last=0,kind='nova';
function preview(type){
 kind=type;s=createState(321);startRun(s);
 const biome=Math.min(6,Math.max(0,Number(new URLSearchParams(location.search).get('biome'))||0));
 s.run.floor=biome*5+1;generateRoom(s);const r=s.run;r.room.rocks=[];
 r.combo=type==='nova'?23:5;s.equipped=type==='nova'?['fury']:type==='wave'?['chain']:[];
 r.room.quota=999;r.cardHits=type==='wave'?5:0;
 const p=r.player,near=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).find(p=>isFloor(r.room,p.x,p.y));
 r.room.nodes[0].x=near.x;r.room.nodes[0].y=near.y;r.room.nodes[0].hp=1;reveal(r.room,p,8);
 w.place(s);const result=act(s,{type:'hit',id:r.room.nodes[0].id},0);w.consume(r.events.splice(0));
 r.room.enemies.push({id:700,type:'enemy',kind:0,x:p.x+2,y:p.y,hp:5,maxHp:5,stunUntil:-1,windup:{x:p.x+1,y:p.y,radius:1,beat:20}});
 $('caption').textContent=type==='nova'?'RUPTURA TOTAL':type==='wave'?'ONDA DE CHOQUE':'RESSONÂNCIA';
 w.fx.update(.16);w.draw(s,1,0,null,null,false);
 $('stats').textContent=(result.ok?'ACERTO · ':'ERRO · ')+w.fx.particles.length+' partículas · '+w.fx.sprites.items.length+' sprites';
}
$('impact').onclick=()=>preview('hit');$('wave').onclick=()=>preview('wave');$('nova').onclick=()=>preview('nova');$('soft').onclick=()=>{w.setSoft(!w.reduced);document.body.classList.toggle('soft-fx',w.reduced);preview(kind);};$('animate').onclick=()=>{running=!running;preview(kind);$('animate').textContent=running?'Congelar':'Animar';};new ResizeObserver(()=>{w.resize();w.draw(s,1,0,null,null,false);}).observe($('stage'));preview('nova');function frame(t){if(running){if(t-last>1500){preview(kind);last=t;}w.draw(s,t/1000,1/60,null,null,false);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
